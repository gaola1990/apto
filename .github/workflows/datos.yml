# Actualiza las licitaciones abiertas y su detalle cada 4 horas, aunque el PC de Apto esté apagado.
# Lo que necesita IA (resúmenes, ¿Cumplo?) sigue en el PC con IA local.
name: Datos de Mercado Público

on:
  schedule:
    - cron: "15 */4 * * *"   # cada 4 horas (UTC)
    - cron: "0 10 3 * *"     # día 3 de cada mes: Compra Ágil del mes anterior
  workflow_dispatch: {}       # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar licitaciones y detalles
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python herramientas/nube.py --minutos 35
      - name: Competencia (ofertas que recibieron las licitaciones adjudicadas)
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python herramientas/competencia.py --dias 2 --minutos 20
      - name: Compra Ágil del mes anterior (solo cifras agregadas, sin datos personales)
        if: github.event.schedule == '0 10 3 * *' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -q duckdb
          python herramientas/compra_agil.py
      - name: Guardián (sin datos personales ni archivos rotos)
        run: python herramientas/guardian.py
      - name: Publicar si hubo cambios
        run: |
          git config user.name "apto-datos"
          git config user.email "apto-datos@users.noreply.github.com"
          git add datos.js detalles.json datos-abiertos/descripciones.jsonl datos-abiertos/adjudicadas.jsonl compra_agil.json competencia.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos de Mercado Público (automático)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 10; done
          exit 1
